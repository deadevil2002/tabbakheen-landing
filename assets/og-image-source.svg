<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.58" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#7c2d12"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fb923c" stop-opacity=".42"/>
      <stop offset="1" stop-color="#fb923c" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#020617" flood-opacity=".45"/>
    </filter>
  </defs>
  <rect width="1200" height="630" rx="0" fill="url(#background)"/>
  <circle cx="936" cy="315" r="285" fill="url(#glow)"/>
  <circle cx="104" cy="92" r="72" fill="#fb923c" opacity=".08"/>
  <circle cx="164" cy="548" r="126" fill="#fb923c" opacity=".06"/>
  <g filter="url(#shadow)">
    <rect x="790" y="115" width="400" height="400" rx="96" fill="#fff" opacity=".96"/>
    <image href="logo.png" x="835" y="160" width="310" height="310" preserveAspectRatio="xMidYMid meet"/>
  </g>
  <g fill="#fff" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="start">
    <text x="90" y="222" font-size="72" font-weight="700">طباخين</text>
    <rect x="90" y="256" width="130" height="8" rx="4" fill="#f97316"/>
    <text x="90" y="340" font-size="40" font-weight="700">اطلب أكل بيتي</text>
    <text x="90" y="398" font-size="35" fill="#fed7aa">من الأسر المنتجة</text>
    <text x="90" y="484" font-size="25" fill="#cbd5e1">متوفر الآن على App Store و Google Play</text>
  </g>
</svg>